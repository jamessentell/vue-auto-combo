name: Release

# Every push to main publishes a new version to npm.
#
# The version comes from scripts/next-version.ts:
# - package.json ahead of the newest vX.Y.Z tag (set by hand, e.g. 0.2.0): use it as-is
# - otherwise: newest tag with the patch number bumped (v0.1.2 -> 0.1.3), committed back to main
#
# Publishing uses npm trusted publishing (OIDC), so no npm token is stored in the repo.
# The trusted publisher on npmjs.com is configured for this file (release.yml) and the
# `npm` environment, so publishing stays in this workflow rather than a separate one.
on:
  push:
    branches: [main]
  workflow_dispatch:

# One release at a time; a push that lands mid-release waits its turn.
concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write # push the version commit and tag, create the GitHub release
  id-token: write # npm trusted publishing

jobs:
  release:
    # Don't release the workflow's own version-bump commit.
    if: >-
      github.actor != 'github-actions[bot]' &&
      !contains(github.event.head_commit.message, '[skip release]')
    runs-on: ubuntu-latest
    environment: npm
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true
          # Optional: a token that is allowed to push to a protected main (see README).
          token: ${{ secrets.RELEASE_TOKEN || github.token }}
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          registry-url: "https://registry.npmjs.org"

      - name: Work out the next version
        id: version
        run: node scripts/next-version.ts

      - run: pnpm install --frozen-lockfile
      - name: Type check
        run: pnpm exec vue-tsc --noEmit -p tsconfig.json
      - name: Run tests
        run: pnpm test

      - name: Set package.json version
        if: steps.version.outputs.bump == 'true'
        run: npm version "${{ steps.version.outputs.version }}" --no-git-tag-version

      - name: Build library
        run: pnpm build

      - name: Commit version and push tag
        env:
          VERSION: ${{ steps.version.outputs.version }}
          BUMP: ${{ steps.version.outputs.bump }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          refs=("refs/tags/v$VERSION")
          if [ "$BUMP" = "true" ]; then
            git commit -am "Release v$VERSION [skip ci] [skip release]"
            refs+=("HEAD:refs/heads/main")
          fi
          git tag -a "v$VERSION" -m "v$VERSION"
          # Atomic: the version commit and the tag land together or not at all.
          git push --atomic origin "${refs[@]}"

      # npm 11.5.1+ (bundled with Node 24) exchanges the OIDC token automatically
      # and adds a provenance attestation.
      - name: Publish to npm
        run: npm publish --access public --ignore-scripts

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "v${{ steps.version.outputs.version }}" --generate-notes --verify-tag
