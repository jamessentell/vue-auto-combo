name: Release

# Publishes to npm when a version tag (for example v0.1.2) is pushed.
# Uses npm trusted publishing (OIDC), so no npm token is stored in the repo.
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write # create the GitHub release
  id-token: write # npm trusted publishing

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: npm
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          registry-url: "https://registry.npmjs.org"

      - name: Check tag matches package.json version
        run: |
          version="v$(node -p "require('./package.json').version")"
          if [ "$version" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match package.json version $version"
            exit 1
          fi

      - run: pnpm install --frozen-lockfile
      - name: Type check
        run: pnpm exec vue-tsc --noEmit -p tsconfig.json
      - name: Run tests
        run: pnpm test
      - name: Build library
        run: pnpm build

      # npm 11.5.1+ (bundled with Node 24) exchanges the OIDC token automatically
      # and adds a provenance attestation.
      - name: Publish to npm
        run: npm publish --access public --ignore-scripts

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --generate-notes --verify-tag
