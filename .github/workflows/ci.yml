name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Type check
        run: pnpm exec vue-tsc --noEmit -p tsconfig.json
      - name: Run tests
        run: pnpm test
      - name: Build library
        run: pnpm build
      - name: Test the built package
        run: pnpm test:dist && pnpm check:dist

  # package.json promises `vue: ^3.4.0`. Build with the repo's Vue (as releases
  # are), then run the suite and a load/render check of dist/ on Vue 3.4, so an
  # API that only newer Vue has (like 3.5's useId in 0.1.2) fails CI.
  vue-compat:
    name: Vue ${{ matrix.vue }} compatibility
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        vue: ['3.4.0', '3.4.38']
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build library
        run: pnpm build
      - name: Install Vue ${{ matrix.vue }}
        # --ignore-scripts keeps `prepare` from rebuilding dist/ with this Vue.
        run: pnpm add -D vue@${{ matrix.vue }} --ignore-scripts
      - name: Run tests on Vue ${{ matrix.vue }}
        run: pnpm test
      - name: Test the built package on Vue ${{ matrix.vue }}
        run: pnpm test:dist && pnpm check:dist

  # Built and deployed in two jobs, as in GitHub's own Pages workflow. With
  # upload and deploy in one job, deploy-pages asked for the artifact under a
  # second after upload finished, and GitHub sometimes didn't list it yet
  # ("No artifacts named github-pages were found"). The gap between jobs
  # gives the artifact time to show up.
  build-storybook:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [test, vue-compat]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read # configure-pages reads the site's settings
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build Storybook
        run: pnpm build-storybook
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: storybook-static

  deploy-storybook:
    needs: build-storybook
    runs-on: ubuntu-latest
    # One Pages deploy at a time; a newer push waits rather than cancelling one mid-deploy.
    concurrency:
      group: pages
      cancel-in-progress: false
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
